{% extends 'base.html' %}
{% block title %}Удалить заявку - KOSTY{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1 class="h4">Удалить заявку?</h1>
  <p>Заявка: <strong>{{ ticket.number }}</strong></p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-outline-secondary" href="{% url 'tickets:detail' ticket.pk %}">Отмена</a>
  </form>
</div>
{% endblock %}
