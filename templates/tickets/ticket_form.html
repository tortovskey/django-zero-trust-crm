{% extends 'base.html' %}
{% block title %}{{ title }} - KOSTY{% endblock %}
{% block content %}
<div class="page-title">
  <div>
    <h1>{{ title }}</h1>
    <p>Права формы зависят от роли: обычный пользователь создает только свою заявку, менеджер может назначать статус и ответственного.</p>
  </div>
</div>
<form method="post" class="panel narrow">
  {% include 'form_fields.html' %}
  <button class="btn btn-primary" type="submit">Сохранить</button>
  <a class="btn btn-outline-secondary" href="{% url 'tickets:list' %}">Отмена</a>
</form>
{% endblock %}
